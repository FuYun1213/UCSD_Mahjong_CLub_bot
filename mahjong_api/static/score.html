<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻将对局 · 拍照登分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#172b27;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:8px 0 24px}h2{font-size:20px}section{background:white;border:1px solid #dddcd4;border-radius:16px;padding:22px;margin:16px 0}.line{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.player{min-width:0;min-height:126px;border:1px solid #d2dad4;border-left:3px solid #376856;border-radius:10px;padding:14px 12px;background:#f4f7f4;color:#172b27;text-align:left;overflow-wrap:anywhere}.player strong,.player span{display:block}.player strong{font-size:18px;margin-bottom:9px}.player .seat-name{font-weight:650;display:flex;gap:7px;align-items:center}.player .seat-action{font-size:13px;margin-top:9px;color:#53645b}.player[data-seat-state="current"]{border:2px solid #245844;background:#e9f4ed}.player[data-seat-state="occupied"]{background:#eceeeb;border-color:#cbd1cb}.player:disabled{opacity:1;cursor:default}.player:focus-visible{outline:3px solid #ca9a23;outline-offset:3px}.player:not(:disabled):hover{background:#e4f0e8}.player[aria-busy="true"]{opacity:.65}label{display:grid;gap:7px;margin:12px 0}input,select,button{font:inherit;border:1px solid #c6cec8;border-radius:8px;padding:10px;max-width:100%}button{background:#245844;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.muted{color:#68756b;font-size:14px}#message{white-space:pre-wrap;padding:12px 0}#elapsed{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.hidden{display:none!important}a{color:#245844}#preview{max-height:250px;max-width:100%;display:block;margin:10px 0}#score-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:600px){.players,#score-fields{grid-template-columns:repeat(2,1fr)}main{padding:20px 12px}}

#reservation-reminders{margin:0 0 12px}#reservation-reminders h2{font-size:15px;margin:0 0 8px}.reservation-reminder{border:1px solid #eadbb4;border-radius:12px;padding:12px 15px;margin:8px 0;background:#fffaf0}.reservation-reminder[data-all-seated="true"]{border-color:#dde1dc;background:#f5f6f4;color:#68756b}.reservation-reminder summary{cursor:pointer;font-size:14px;font-weight:650}.reservation-reminder ul{display:flex;flex-wrap:wrap;gap:7px 22px;list-style:none;padding:0;margin:10px 0 0;font-size:14px}.reservation-reminder li{overflow-wrap:anywhere;display:flex;align-items:center;gap:5px}.reservation-reminder .reservation-personal{margin-top:12px;font-size:13px}.reservation-personal p{margin:7px 0}#swap-status{min-height:0;margin:0;color:#53645b;font-size:14px}#swap-status:not(:empty){padding:5px 0 10px}#seat-swap-dialog{position:fixed;inset:24px auto auto 50%;transform:translateX(-50%);margin:0;width:min(480px,calc(100% - 24px));max-height:calc(100vh - 48px);overflow:auto;border:1px solid #c6cec8;border-radius:16px;padding:24px;color:#172b27;background:#fff;box-shadow:0 15px 60px #172b2733}#seat-swap-dialog::backdrop{background:#172b2766}#seat-swap-dialog h2{margin:0 0 14px;font-size:21px}#seat-swap-dialog p{overflow-wrap:anywhere}#seat-swap-dialog .swap-changes{background:#f4f7f4;border-radius:10px;padding:8px 14px}#seat-swap-dialog .line{margin-top:20px;gap:10px}#seat-swap-dialog .line button{flex:1}#swap-back,#swap-decline{background:white;color:#245844}#swap-error{color:#9b3027}
</style></head><body><main>
<a href="/" data-text="pBack"></a><div class="line"><h1 data-text="pTitle"></h1></div>
<input id="table" type="hidden"><button id="load" class="hidden" data-text="pLoad"></button>
<div id="message" role="status" aria-live="polite"></div>
<aside id="reservation-reminders" hidden></aside>
<section><div class="line"><h2 id="round" data-text="ordinaryCurrent"></h2><span id="order" class="muted" data-text="pWinds"></span></div><div class="players" id="players" aria-live="polite" aria-busy="false"></div><div class="line" style="margin-top:16px"><button id="leave-table" type="button" data-text="pSeatLeaveButton" disabled></button><span id="leave-hint" class="muted" data-text="pSeatNotSeated"></span></div><p id="seat-message" class="muted" role="status" aria-live="polite"></p><p id="swap-status" role="status" aria-live="polite"></p><p><span data-text="pStarted"></span>: <span id="started" data-text="pWaitingFour"></span></p><div class="line"><span data-text="pDuration"></span><span id="elapsed">—</span></div><p class="muted"><span data-text="pAverage"></span>: <span id="average" data-text="pNoRecords"></span></p></section>
<section><h2 data-text="pUpload"></h2><p class="muted" data-text="pPhotoNote"></p><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><img id="preview" class="hidden"><div class="line"><button id="recognize" disabled data-text="pRecognize"></button><button id="manual" data-text="pManual"></button></div><p class="muted" data-text="pOcrNote"></p></section>
<section id="review" class="hidden"><h2 data-text="pReview"></h2><p class="muted" data-text="pReviewNote"></p><p id="review-reason" class="muted"></p><form id="confirm"><div id="score-fields"></div><p><span data-text="pTotal"></span>: <strong id="total">0</strong> / 100000</p><button data-text="pConfirm"></button></form></section>
<section id="result" class="hidden"><h2 data-text="pResult"></h2><p id="local-status"></p><p id="external-status"></p><button id="retry-sync" hidden data-text="retry"></button><pre id="result-text" style="white-space:pre-wrap"></pre></section>

<dialog id="seat-swap-dialog" aria-labelledby="swap-title" aria-describedby="swap-note"><h2 id="swap-title"></h2><p id="swap-note"></p><div class="swap-changes"><p id="swap-requester-change"></p><p id="swap-target-change"></p></div><p id="swap-countdown" class="muted"></p><p id="swap-error" role="alert"></p><div class="line"><button id="swap-back" type="button" data-text="swapBack"></button><button id="swap-send" type="button" data-text="swapSend"></button><button id="swap-decline" type="button" data-text="swapDecline"></button><button id="swap-accept" type="button" data-text="swapAccept"></button></div></dialog>
</main><script src="/i18n.js?v=seat-leave-v12"></script><script src="/seat-card-i18n.js?v=seat-leave-v12"></script><script src="/seat-swap-i18n.js?v=seat-leave-v12"></script><script src="/reservation-v9-i18n.js?v=seat-leave-v12"></script><script src="/account-avatar.js?v=seat-leave-v12"></script><script src="/score-i18n.js?v=seat-leave-v12"></script></body></html>
